version: 2.1

# The repo is a Go workspace (go.work) over several per-demo modules rather than
# a module itself, so every Go step fans out via the Makefile instead of using
# `go build ./...` at the root. See Makefile for the module list.

orbs:
  # Traces this repo's own pipeline into Honeycomb — see the otel_setup job
  # comment below for what this does and doesn't give you.
  buildevents: honeycombio/buildevents@0.12.0

# enable a job when a tag is created (tag create is ignored by default)
filters_always: &filters_always
  filters:
    tags:
      only: /.*/

matrix_goversions: &matrix_goversions
  matrix:
    parameters:
      goversion: ["26"]

# Default version of Go to use for Go steps. The modules declare go 1.26, so
# that is the floor; add newer versions to the matrix above as they ship.
default_goversion: &default_goversion "26"

# Shared by every job that calls a buildevents command, so the dataset name
# can't drift between them.
buildevents_env: &buildevents_env
  BUILDEVENT_DATASET: cicd-pipeline-live

executors:
  go:
    parameters:
      goversion:
        type: string
        default: *default_goversion
    docker:
      - image: cimg/go:1.<< parameters.goversion >>
  terraform:
    docker:
      - image: hashicorp/terraform:1.15
  shell:
    docker:
      - image: koalaman/shellcheck-alpine:v0.10.0

commands:
  restore_go_cache:
    steps:
      - restore_cache:
          keys:
            - v1-go-mod-{{ checksum "session-1-fundamentals/otel-quickstart/go.sum" }}-{{ checksum "session-1-fundamentals/seed-sample-service/go.sum" }}-{{ checksum "session-1-fundamentals/instrumentation-traps/go.sum" }}-{{ checksum "session-2-feedback-loops/go.sum" }}-{{ checksum "session-3-business-case/go.sum" }}-{{ checksum "session-4-slis-slos/go.sum" }}-{{ checksum "session-5-cost-sampling/go.sum" }}-{{ checksum "session-6-every-domain/go.sum" }}
            - v1-go-mod-
  save_go_cache:
    steps:
      - save_cache:
          key: v1-go-mod-{{ checksum "session-1-fundamentals/otel-quickstart/go.sum" }}-{{ checksum "session-1-fundamentals/seed-sample-service/go.sum" }}-{{ checksum "session-1-fundamentals/instrumentation-traps/go.sum" }}-{{ checksum "session-2-feedback-loops/go.sum" }}-{{ checksum "session-3-business-case/go.sum" }}-{{ checksum "session-4-slis-slos/go.sum" }}-{{ checksum "session-5-cost-sampling/go.sum" }}-{{ checksum "session-6-every-domain/go.sum" }}
          paths:
            - /home/circleci/go/pkg/mod

jobs:
  # Traces this repo's own CircleCI pipeline into Honeycomb via
  # honeycombio/buildevents-orb — real spans from a real run of this
  # pipeline, alongside session 6's synthetic cicd-pipeline dataset.
  # buildevents predates OTel: it ships its own field names (job_name,
  # build_num, branch, ...) straight to Honeycomb's classic Events API, not
  # OTLP or the cicd.pipeline.*/vcs.change.id semconv session 6's seeder
  # uses — that seeded dataset is what carries the semconv story for
  # querying. This is real texture on top of it, not a replacement.
  #
  # Only wraps jobs confirmed to run on a bash+curl-capable image
  # (buildevents-orb's commands need both): the go executor (cimg/go) and
  # the machine executor. terraform_validate and shellcheck run on Alpine
  # images confirmed (docker run --entrypoint which ... bash/curl, both
  # exit 1) to lack both, so they're left unwrapped rather than risk
  # breaking those jobs on an assumption.
  #
  # Three things aren't committed here, with different failure blast radii:
  #   - Third-party orbs enabled in this org's CircleCI Security settings.
  #     This is a hard prerequisite for the *entire* pipeline: if it's off,
  #     CircleCI refuses to process this config at all and no job in this
  #     workflow runs, not just the ones below.
  #   - BUILDEVENT_APIKEY (a Honeycomb send-events key), as a project env
  #     var. If unset, buildevents falls back to writing events to stdout
  #     instead of sending them (see honeycombio/buildevents' createEvent) —
  #     every job below still passes, nothing lands in Honeycomb.
  #   - BUILDEVENT_CIRCLE_API_TOKEN (a CircleCI personal API token with read
  #     access to this project), as a project env var. If unset,
  #     otel_watch's polling errors and that job fails — but nothing
  #     requires otel_watch, so merge-gating checks stay green regardless.
  otel_setup:
    docker:
      - image: cimg/base:stable
    environment:
      <<: *buildevents_env
    steps:
      - buildevents/start_trace

  # Polls the CircleCI API until every other job finishes, then sends the
  # root span for the whole pipeline run. Depends on otel_setup for the
  # cached buildevents binary; nothing depends on this.
  otel_watch:
    docker:
      - image: cimg/base:stable
    environment:
      <<: *buildevents_env
    steps:
      - buildevents/watch_build_and_finish

  # Build, vet, test, and gofmt-check every module. The test suites include the
  # end-to-end delivery tests, which stand up an in-process OTLP receiver and
  # assert that every span a seeder generates actually arrives — the regression
  # that unit tests could not see.
  verify:
    parameters:
      goversion:
        type: string
        default: *default_goversion
    executor:
      name: go
      goversion: << parameters.goversion >>
    environment:
      <<: *buildevents_env
    steps:
      # checkout runs before with_job_span, not inside it: with_job_span's
      # own restore_cache (the buildevents binary) populates ~/project/bin
      # first, and checkout refuses to clone into a non-empty, non-git
      # directory if it runs after that.
      - checkout
      - buildevents/with_job_span:
          steps:
            - restore_go_cache
            - run:
                name: Check go.mod/go.sum are tidy
                command: make tidy-check
            - run:
                name: Build, vet, test, gofmt
                command: make verify
            - save_go_cache

  # Dependency drift is a real failure mode here: session-2 was created after a
  # security bump and silently resolved gRPC back to the vulnerable version,
  # because an indirect dependency tracks the module graph minimum.
  vulncheck:
    executor: go
    environment:
      <<: *buildevents_env
    steps:
      - checkout
      - buildevents/with_job_span:
          steps:
            - restore_go_cache
            - run:
                name: govulncheck
                command: make vulncheck
            - save_go_cache

  # Terraform is validated but never planned: `plan` needs credentials and a
  # remote workspace, and neither belongs in a public repo's CI. Each session
  # with a Terraform directory gets its own fmt/init/validate steps here —
  # session-4 has no shell-script alternative (see its README), so this is
  # the only CI coverage its Honeycomb setup gets.
  terraform_validate:
    executor: terraform
    steps:
      - checkout
      - run:
          name: terraform fmt (session-2)
          command: terraform -chdir=session-2-feedback-loops/honeycomb-setup/terraform fmt -check -diff -recursive
      - run:
          name: terraform init (session-2)
          command: terraform -chdir=session-2-feedback-loops/honeycomb-setup/terraform init -backend=false -input=false
      - run:
          name: terraform validate (session-2)
          command: terraform -chdir=session-2-feedback-loops/honeycomb-setup/terraform validate
      - run:
          name: terraform fmt (session-4)
          command: terraform -chdir=session-4-slis-slos/honeycomb-setup/terraform fmt -check -diff -recursive
      - run:
          name: terraform init (session-4)
          command: terraform -chdir=session-4-slis-slos/honeycomb-setup/terraform init -backend=false -input=false
      - run:
          name: terraform validate (session-4)
          command: terraform -chdir=session-4-slis-slos/honeycomb-setup/terraform validate
      - run:
          name: terraform fmt (session-5)
          command: terraform -chdir=session-5-cost-sampling/honeycomb-setup/terraform fmt -check -diff -recursive
      - run:
          name: terraform init (session-5)
          command: terraform -chdir=session-5-cost-sampling/honeycomb-setup/terraform init -backend=false -input=false
      - run:
          name: terraform validate (session-5)
          command: terraform -chdir=session-5-cost-sampling/honeycomb-setup/terraform validate
      - run:
          name: terraform fmt (session-6)
          command: terraform -chdir=session-6-every-domain/honeycomb-setup/terraform fmt -check -diff -recursive
      - run:
          name: terraform init (session-6)
          command: terraform -chdir=session-6-every-domain/honeycomb-setup/terraform init -backend=false -input=false
      - run:
          name: terraform validate (session-6)
          command: terraform -chdir=session-6-every-domain/honeycomb-setup/terraform validate

  # session-1's Collector config is now load-bearing for sessions 5 and 6
  # (adaptive_tail_sampling, redaction, and the logs pipeline), so it gets the same
  # "validated but never actually run" treatment as the Terraform above:
  # `validate` parses and builds the pipeline graph without starting the
  # Collector or needing real credentials. This is a real check, not a
  # formality — it's what caught an invalid OTTL condition path
  # (`status.code` instead of `span.status.code`) while this config was being
  # written.
  #
  # machine, not docker+image, because honeycombio/honeycomb-opentelemetry-collector
  # is a scratch-based image with no shell and no git — checkout can't run
  # inside it, so this job needs a real Docker daemon to run that image
  # alongside a normal git-capable environment instead.
  collector_config_validate:
    machine:
      image: ubuntu-2404:current
    environment:
      <<: *buildevents_env
    steps:
      - checkout
      - buildevents/with_job_span:
          steps:
            - run:
                name: validate session-1's Collector config
                command: |
                  docker run --rm \
                    -v "$(pwd)/session-1-fundamentals/collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro" \
                    -e HONEYCOMB_API_KEY=dummy-not-used-by-validate \
                    honeycombio/honeycomb-opentelemetry-collector:v0.0.40 \
                    validate --config=/etc/otel-collector-config.yaml

  shellcheck:
    executor: shell
    steps:
      - checkout
      - run:
          name: shellcheck
          command: shellcheck session-2-feedback-loops/honeycomb-setup/scripts/*.sh

workflows:
  ci:
    jobs:
      - otel_setup:
          <<: *filters_always
      - otel_watch:
          <<: *filters_always
          requires: [otel_setup]
      # Merged as a list rather than two `<<:` keys on one mapping: duplicate
      # merge keys are an error in strict YAML parsers, and where they are
      # tolerated only one of the two is applied.
      - verify:
          <<: [*filters_always, *matrix_goversions]
          requires: [otel_setup]
      - vulncheck:
          <<: *filters_always
          requires: [otel_setup]
      - terraform_validate:
          <<: *filters_always
      - collector_config_validate:
          <<: *filters_always
          requires: [otel_setup]
      - shellcheck:
          <<: *filters_always
