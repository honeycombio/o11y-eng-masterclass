version: 2.1

# The repo is a Go workspace (go.work) over several per-demo modules rather than
# a module itself, so every Go step fans out via the Makefile instead of using
# `go build ./...` at the root. See Makefile for the module list.

# enable a job when a tag is created (tag create is ignored by default)
filters_always: &filters_always
  filters:
    tags:
      only: /.*/

matrix_goversions: &matrix_goversions
  matrix:
    parameters:
      goversion: ["26"]

# Default version of Go to use for Go steps. The modules declare go 1.26, so
# that is the floor; add newer versions to the matrix above as they ship.
default_goversion: &default_goversion "26"

executors:
  go:
    parameters:
      goversion:
        type: string
        default: *default_goversion
    docker:
      - image: cimg/go:1.<< parameters.goversion >>
  terraform:
    docker:
      - image: hashicorp/terraform:1.15
  shell:
    docker:
      - image: koalaman/shellcheck-alpine:v0.10.0

commands:
  restore_go_cache:
    steps:
      - restore_cache:
          keys:
            - v1-go-mod-{{ checksum "session-1-fundamentals/otel-quickstart/go.sum" }}-{{ checksum "session-1-fundamentals/seed-sample-service/go.sum" }}-{{ checksum "session-1-fundamentals/instrumentation-traps/go.sum" }}-{{ checksum "session-2-feedback-loops/go.sum" }}-{{ checksum "session-3-business-case/go.sum" }}-{{ checksum "session-4-slis-slos/go.sum" }}-{{ checksum "session-5-cost-sampling/go.sum" }}
            - v1-go-mod-
  save_go_cache:
    steps:
      - save_cache:
          key: v1-go-mod-{{ checksum "session-1-fundamentals/otel-quickstart/go.sum" }}-{{ checksum "session-1-fundamentals/seed-sample-service/go.sum" }}-{{ checksum "session-1-fundamentals/instrumentation-traps/go.sum" }}-{{ checksum "session-2-feedback-loops/go.sum" }}-{{ checksum "session-3-business-case/go.sum" }}-{{ checksum "session-4-slis-slos/go.sum" }}-{{ checksum "session-5-cost-sampling/go.sum" }}
          paths:
            - /home/circleci/go/pkg/mod

jobs:
  # Build, vet, test, and gofmt-check every module. The test suites include the
  # end-to-end delivery tests, which stand up an in-process OTLP receiver and
  # assert that every span a seeder generates actually arrives — the regression
  # that unit tests could not see.
  verify:
    parameters:
      goversion:
        type: string
        default: *default_goversion
    executor:
      name: go
      goversion: << parameters.goversion >>
    steps:
      - checkout
      - restore_go_cache
      - run:
          name: Check go.mod/go.sum are tidy
          command: make tidy-check
      - run:
          name: Build, vet, test, gofmt
          command: make verify
      - save_go_cache

  # Dependency drift is a real failure mode here: session-2 was created after a
  # security bump and silently resolved gRPC back to the vulnerable version,
  # because an indirect dependency tracks the module graph minimum.
  vulncheck:
    executor: go
    steps:
      - checkout
      - restore_go_cache
      - run:
          name: govulncheck
          command: make vulncheck
      - save_go_cache

  # Terraform is validated but never planned: `plan` needs credentials and a
  # remote workspace, and neither belongs in a public repo's CI. Each session
  # with a Terraform directory gets its own fmt/init/validate steps here —
  # session-4 has no shell-script alternative (see its README), so this is
  # the only CI coverage its Honeycomb setup gets.
  terraform_validate:
    executor: terraform
    steps:
      - checkout
      - run:
          name: terraform fmt (session-2)
          command: terraform -chdir=session-2-feedback-loops/honeycomb-setup/terraform fmt -check -diff -recursive
      - run:
          name: terraform init (session-2)
          command: terraform -chdir=session-2-feedback-loops/honeycomb-setup/terraform init -backend=false -input=false
      - run:
          name: terraform validate (session-2)
          command: terraform -chdir=session-2-feedback-loops/honeycomb-setup/terraform validate
      - run:
          name: terraform fmt (session-4)
          command: terraform -chdir=session-4-slis-slos/honeycomb-setup/terraform fmt -check -diff -recursive
      - run:
          name: terraform init (session-4)
          command: terraform -chdir=session-4-slis-slos/honeycomb-setup/terraform init -backend=false -input=false
      - run:
          name: terraform validate (session-4)
          command: terraform -chdir=session-4-slis-slos/honeycomb-setup/terraform validate
      - run:
          name: terraform fmt (session-5)
          command: terraform -chdir=session-5-cost-sampling/honeycomb-setup/terraform fmt -check -diff -recursive
      - run:
          name: terraform init (session-5)
          command: terraform -chdir=session-5-cost-sampling/honeycomb-setup/terraform init -backend=false -input=false
      - run:
          name: terraform validate (session-5)
          command: terraform -chdir=session-5-cost-sampling/honeycomb-setup/terraform validate

  # session-1's Collector config is now load-bearing for session 5's demo
  # (the adaptive_tail_sampling processor and its rules), so it gets the same
  # "validated but never actually run" treatment as the Terraform above:
  # `validate` parses and builds the pipeline graph without starting the
  # Collector or needing real credentials. This is a real check, not a
  # formality — it's what caught an invalid OTTL condition path
  # (`status.code` instead of `span.status.code`) while this config was being
  # written.
  #
  # machine, not docker+image, because honeycombio/honeycomb-opentelemetry-collector
  # is a scratch-based image with no shell and no git — checkout can't run
  # inside it, so this job needs a real Docker daemon to run that image
  # alongside a normal git-capable environment instead.
  collector_config_validate:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: validate session-1's Collector config
          command: |
            docker run --rm \
              -v "$(pwd)/session-1-fundamentals/collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro" \
              -e HONEYCOMB_API_KEY=dummy-not-used-by-validate \
              honeycombio/honeycomb-opentelemetry-collector:v0.0.40 \
              validate --config=/etc/otel-collector-config.yaml

  shellcheck:
    executor: shell
    steps:
      - checkout
      - run:
          name: shellcheck
          command: shellcheck session-2-feedback-loops/honeycomb-setup/scripts/*.sh

workflows:
  ci:
    jobs:
      # Merged as a list rather than two `<<:` keys on one mapping: duplicate
      # merge keys are an error in strict YAML parsers, and where they are
      # tolerated only one of the two is applied.
      - verify:
          <<: [*filters_always, *matrix_goversions]
      - vulncheck:
          <<: *filters_always
      - terraform_validate:
          <<: *filters_always
      - collector_config_validate:
          <<: *filters_always
      - shellcheck:
          <<: *filters_always
