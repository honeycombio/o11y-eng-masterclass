services:
  otel-collector:
    # Pinned deliberately. On :latest, two people running this file on different
    # days get different binaries — which is how a config that works for one
    # person fails for another with no diff to point at.
    #
    # Honeycomb's own distro, not otel/opentelemetry-collector-contrib: MC5
    # needs adaptivetailsamplingprocessor, which isn't in contrib and ships
    # here as an explicitly experimental preview (see the config's comment on
    # the adaptive_tail_sampling processor). MC1-4 are unaffected — their
    # traffic falls through to the config's default always_sample rule.
    image: honeycombio/honeycomb-opentelemetry-collector:v0.0.40
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    environment:
      - HONEYCOMB_API_KEY=${HONEYCOMB_API_KEY:?set HONEYCOMB_API_KEY before starting the collector}
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
