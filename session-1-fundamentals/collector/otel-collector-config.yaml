receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # For MC6's LLM demo: session-6's live traffic is real Claude Code OTel
  # telemetry (see session-6-every-domain/README.md), which carries the
  # user's real organization.id, user.account_id, and user.account_uuid on
  # every span and log event. Masked (not deleted) here so a live/recorded
  # session doesn't project those identifiers on screen; user.email passes
  # through deliberately (see session-6's README for why). Safe as a global
  # rule, not scoped to service.name=claude-code: no other session's data
  # uses these attribute keys, and the redactionprocessor has no per-service
  # matching of its own to scope with anyway.
  redaction:
    allow_all_keys: true
    blocked_key_patterns:
      - "^organization\\.id$"
      - "^user\\.account_id$"
      - "^user\\.account_uuid$"
    summary: silent
  # For MC5's cost/sampling demo: real tail sampling as a single Collector
  # processor rather than a separate Refinery deployment. Upstream `development`
  # stability (see the distro's own README) — pinned to a specific distro
  # version in ../collector/docker-compose.yml for exactly that reason.
  #
  # Rules are first-match, in order:
  #   1. keep-errors: every errored span, from any session's traffic. Global
  #      and harmless — MC1-4 don't generate enough error volume for this to
  #      change what their demos show, and an error is worth keeping regardless
  #      of which session produced it.
  #   2. cost-sampling-service: MC5's own seeded traffic (see
  #      ../../session-5-cost-sampling), sampled to a ~5% target rate per
  #      http.route (fingerprint_attributes below) rather than one global
  #      rate, so a low-volume route stays visible instead of being swallowed
  #      by the high-volume ones — see session-5-cost-sampling/internal/scenario's
  #      package comment.
  #   3. default: everything else — MC1-4's traffic — passes through
  #      untouched. This is what keeps "session-1's Collector is reused" true
  #      for those sessions despite this processor's addition.
  adaptive_tail_sampling:
    trace_timeout: 30s
    decision_delay: 2s
    num_traces: 50000
    rules:
      - name: keep-errors
        conditions:
          - "span.status.code == STATUS_CODE_ERROR"
        sampler:
          type: always_sample
      - name: cost-sampling-service
        conditions:
          - 'resource.attributes["service.name"] == "cost-sampling-service"'
        sampler:
          type: adaptive_percentage
          goal_percentage: 5
          fingerprint_attributes:
            - span.attributes["http.route"]
          adjustment_interval: 15s
      - name: default
        sampler:
          type: always_sample
  batch:

exporters:
  # otlp_http, not otlphttp: the old spelling is a deprecated alias as of
  # Collector 0.157.0 and warns on every startup.
  otlp_http/honeycomb:
    endpoint: https://api.honeycomb.io
    headers:
      x-honeycomb-team: ${env:HONEYCOMB_API_KEY}

service:
  pipelines:
    traces:
      receivers: [otlp]
      # redaction first (normalise/secure before anything else touches the
      # data), then adaptive_tail_sampling ahead of batch: it decides per
      # whole trace, so it needs to see spans before batch regroups them for
      # export.
      processors: [redaction, adaptive_tail_sampling, batch]
      exporters: [otlp_http/honeycomb]
    # For MC6's LLM demo: Claude Code's own telemetry (claude_code.api_request
    # and friends) arrives as log records, not spans — see
    # session-6-every-domain/README.md. No other session in this repo emits
    # logs, so this pipeline exists solely for that traffic.
    logs:
      receivers: [otlp]
      processors: [redaction, batch]
      exporters: [otlp_http/honeycomb]
